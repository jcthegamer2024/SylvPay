
name: SylvPay
version: '${version}'
main: org.sylvarion.sylvpay.SylvPayMain
api-version: '26.1'
description: Tap2Go ticket machine, fare gates, validators and journey management

dependencies:
  server:
    Vault:
      load: BEFORE
      required: true
      join-classpath: true

    CMI:
      load: BEFORE
      required: false
      join-classpath: true

    Nexo:
      load: BEFORE
      required: true
      join-classpath: true
