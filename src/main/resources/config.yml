# SylvPay configuration — configurable GUI button slots (0-53)
debug:
  enabled: false
currency:
  symbol: £
  position: before
  decimals: 2
  thousands-separator: true
  space: false
ticket-machine:
  furniture-id: sylv_ticket_machine
gui:
  sounds:
    enabled: true
    button:
      sound: minecraft:ui.button.click
      volume: 0.6
      pitch: 1.0
    keypad:
      sound: minecraft:ui.button.click
      volume: 0.6
      pitch: 1.35
  title: <dark_gray>SylvPay Ticket Machine
  history-title: <dark_gray>Tap2Go Transaction History
  topup-title: <dark_gray>Top Up Your Card
  insert-title: <dark_gray>Insert Tap2Go Card
  create-title: <dark_gray>Create Tap2Go Card
  main:
    show-items: false
    slots:
      create-card:
        - 19
        - 20
        - 28
        - 29
      balance:
        - 23
        - 24
        - 32
        - 33
      topup:
        - 37
        - 38
        - 46
        - 47
      refund:
        - 41
        - 42
        - 50
        - 51
      history:
        - 35
      card-reader: []
  custom:
    enabled: false
    glyph: tap2gomainscreen
    title-shift: -9
    topup-glyph: sylvpay_topup
    shift: ''
    prefix: <!italic><!bold><white>
    suffix: ''
    insert:
      enabled: false
      glyph: tap2goinsertcard
      title-shift: -9
    create:
      enabled: false
      glyph: tap2gocreatecard
      title-shift: -9
    history:
      enabled: false
      glyph: tap2gohistory
      title-shift: -9
    numpad:
      enabled: false
      glyph: tap2gonumpad
      title-shift: -9
  insert:
    card-slot: 13
    back-slot: 22
    show-items: true
    info-slot: 11
    continue-slot: 15
  create:
    # Slots remain clickable when their button items are hidden.
    show-confirm-item: false
    show-back-item: false
    slots:
      info: 13
      confirm: 33
      back: 53
  topup:
    # Hide these items when the buttons are drawn into the GUI texture.
    # Their configured slots remain clickable; number and info items stay visible.
    show-confirm-item: false
    show-back-item: false
    slots:
      info: 13
      confirm: 33
      back: 53
  history:
    # Hide the item while keeping slots.back clickable (slots are numbered 0-53).
    show-back-item: false
    slots:
      card-reader: 4
      previous-page: 36
      next-page: 44
      back: 40
      empty: 22
      entries:
        - 9
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 18
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 27
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
  numpad:
    show-items: true
    info:
      material: PAPER
      item-model: sylvpay:invisible_gui_item
    items:
      '1':
        item-model: sylvpay:keypad_1
      '2':
        item-model: sylvpay:keypad_2
      '3':
        item-model: sylvpay:keypad_3
      '4':
        item-model: sylvpay:keypad_4
      '5':
        item-model: sylvpay:keypad_5
      '6':
        item-model: sylvpay:keypad_6
      '7':
        item-model: sylvpay:keypad_7
      '8':
        item-model: sylvpay:keypad_8
      '9':
        item-model: sylvpay:keypad_9
      '0':
        item-model: sylvpay:keypad_0
      decimal:
        item-model: sylvpay:keypad_decimal
      clear:
        material: PAPER
        item-model: sylvpay:keypad_clear
    slots:
      '1': 19
      '2': 20
      '3': 21
      '4': 28
      '5': 29
      '6': 30
      '7': 37
      '8': 38
      '9': 39
      '0': 47
      decimal: 46
      clear: 48
      confirm: 33
      back: 53
card:
  material: PAPER
  item-model: sylvpay:tap2go_card
  name: <gold><bold>SylvPay Tap2Go
  lore:
    - '<gray>Card ID: <white>{id}'
    - <dark_gray>Top up at any ticket machine.
  price: 2.5
  max-creation-balance: 500.0
max-balance: 1000
buttons:
  balance:
    material: CLOCK
    item-model: ''
    name: <aqua>Check Balance
    lore:
      - <gray>Uses the card in your inventory.
  topup:
    material: EMERALD
    item-model: ''
    name: <green>Top Up Card
    lore:
      - <gray>Add money from your balance.
  refund:
    material: REDSTONE
    item-model: ''
    name: <red>Refund Card
    lore:
      - <gray>Takes your card and returns
      - <gray>its balance to your account.
  back:
    material: ARROW
    item-model: ''
    name: <gray>Back
    lore: []
faregates:
  enabled: false
  models:
    closed: sylv_faregate_closed
    open: sylv_faregate_open
  tap-cooldown-ms: 1500
  opening:
    timeout-ticks: 100
    clearance-radius: 0.85
    lane-half-width: 1.0
  sounds:
    tap-in:
      enabled: true
      sound: minecraft:block.note_block.bell
      volume: 0.8
      pitch: 1.4
    tap-out:
      enabled: true
      sound: minecraft:block.note_block.bell
      volume: 0.8
      pitch: 1.0
validators:
  enabled: true
  furniture-id: sylv_validator
  tap-cooldown-ms: 1500
  sounds:
    tap-in:
      enabled: true
      sound: minecraft:block.note_block.bell
      volume: 0.8
      pitch: 1.4
    tap-out:
      enabled: true
      sound: minecraft:block.note_block.bell
      volume: 0.8
      pitch: 1.0
